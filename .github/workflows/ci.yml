# .github/workflows/ci.yml
#
# Demoscene Simulator CI — runs the full gate on every push to `main` and on
# every PR. The gate is:
#   1. `npm ci` to lock the dep tree (npm install lockfile-aware)
#   2. `npm run lint`         → `tsc --noEmit` — type errors block the build
#   3. `npm run test:all`     → every `sim/__tests__/*` smoke test runner
#   4. `npm run audit:docs`   → doc-vs-export parity check
#   5. `npm run build`        → `vite build` for the renderer entry
#
# The capture pipeline (`capture:preview`) is intentionally NOT part of
# the CI gate — it requires system Chrome and a writable `build/` dir,
# and is opt-in via the dedicated manual `nightly` workflow (see below).

name: ci

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  # Manual trigger so release engineers can refresh build/preview.{png,webm}
  # without having to push a no-op commit to main. Runs the capture-preview
  # job only (the gate job is skipped via the if-guard on capture-preview).
  workflow_dispatch:

# Cancel a previous in-flight run for the same PR when a new commit
# lands — saves the runner budget on noisy PRs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: tsc + smoke + audit + vite build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: tsc --noEmit (npm run lint)
        run: npm run lint

      - name: Audit docs (sim exports ↔ docs/prompts references)
        run: npm run audit:docs

      - name: Run every smoke test (npm run test:all)
        run: npm run test:all

      - name: vite build (renderer)
        run: npm run build

  # macOS packaging job. DMG creation needs `hdiutil`, which only exists
  # on macOS — electron-builder cannot produce .dmg on Linux/Windows
  # runners — so this job runs on macos-latest. It is gated the same way
  # as capture-preview (push to main OR manual dispatch) to keep the
  # per-PR cost at zero; the produced .dmg/.zip artifacts are uploaded
  # for the release engineer to attach to the GitHub Release.
  build-macos:
    name: package macOS (dmg + zip, x64 + arm64)
    runs-on: macos-latest
    needs: gate
    # Runs on push to main (gate also validates the commit), on v* tag
    # pushes (release-cut: package the release artifacts), and on manual
    # workflow_dispatch.
    if: >-
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      github.event_name == 'workflow_dispatch'
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # `build/` is gitignored (icons are generated, never committed), so
      # regenerate icon.png / icon.ico / icon.icns before packaging.
      - name: Generate app icons
        run: npm run icons

      # No signing identity on the runner — disable identity auto-
      # discovery so electron-builder skips keychain probing and goes
      # straight to an unsigned (ad-hoc) build deterministically. To
      # publish a signed/notarized build, add the standard
      # CSC_LINK / CSC_KEY_PASSWORD secrets and drop this env.
      - name: Package macOS artifacts (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: demoscene-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14

      # On v* tag pushes, publish the packaged artifacts to the GitHub
      # Release for that tag. Requires the RELEASE_TOKEN secret (a PAT
      # with `repo` scope) — set once via `gh secret set RELEASE_TOKEN`.
      # Tokens are never committed to the repo; the workflow only reads
      # the secret. Creates the release if it doesn't exist yet.
      - name: Publish DMG + zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          files: |
            release/*.dmg
            release/*.zip
          # Idempotent: a retried run or force-re-pushed tag replaces the
          # existing assets instead of failing on duplicate names.
          overwrite: true
          generate_release_notes: false

  # Manual opt-in workflow for the capture pipeline. Requires a Linux
  # runner that has system Chrome installed; the default ubuntu-latest
  # ships WITHOUT Chrome, so we skip the capture job on the regular gate
  # and let release engineers trigger it manually (push to main OR
  # workflow_dispatch) when they need to refresh
  # `build/preview.{png,webm,gif}`.
  capture-preview:
    name: capture:preview (manual, requires system Chrome)
    runs-on: ubuntu-latest
    needs: gate
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # Install system Chromium. Note: on ubuntu-24.04 (the current
      # `ubuntu-latest`) the package is `chromium` (no `-browser` suffix);
      # on ubuntu-22.04 it was `chromium-browser`. We use the modern
      # `chromium` name which has been the canonical name since
      # ubuntu-23.10. The capture script's findSystemChrome() already
      # checks `/usr/bin/chromium` as a candidate.
      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium
          echo "PUPPETEER_EXECUTABLE_PATH=$(which chromium)" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Capture preview PNG + WebM (skip GIF for CI determinism)
        run: npm run capture:preview:no-gif

      - name: Upload capture artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v0.2.0-preview
          path: |
            build/preview.png
            build/preview.webm
          if-no-files-found: error
          retention-days: 14
